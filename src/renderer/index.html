<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Hermann Planner</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header id="titlebar">
      <span id="title">Hermann Planner</span>
      <div id="window-controls">
        <button id="btn-tray" title="트레이로 최소화">—</button>
        <button id="btn-close" title="종료">×</button>
      </div>
    </header>

    <div id="auth-bar">
      <button id="btn-login">Google 계정 로그인</button>
      <button id="btn-logout" class="hidden">로그아웃</button>
      <span id="auth-status"></span>
    </div>

    <main id="content">
      <section id="pane-calendar">
        <div id="month-nav">
          <div id="month-nav-left">
            <button id="btn-prev-month" title="이전 달">◀</button>
            <span id="month-label"></span>
            <button id="btn-next-month" title="다음 달">▶</button>
          </div>
          <button id="btn-add-event" title="새 일정 추가">+ 일정 추가</button>
        </div>
        <div class="weekday-row">
          <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
        </div>
        <div id="days-grid" class="days-grid"></div>
      </section>

      <div id="pane-resizer" title="드래그해서 너비 조절"></div>

      <section id="pane-tasks">
        <h2 class="pane-title">할일</h2>
        <div id="task-input-row">
          <input id="new-task-input" type="text" placeholder="할일 추가" />
        </div>
        <div id="tasks-list" class="scroll-list">
          <p class="empty-message">로그인 후 할일이 표시됩니다.</p>
        </div>
      </section>
    </main>

    <div id="event-edit-modal" class="modal-overlay hidden">
      <div class="modal-box">
        <h3>일정 수정</h3>
        <label for="event-edit-calendar">캘린더</label>
        <select id="event-edit-calendar"></select>
        <label for="event-edit-title">제목</label>
        <input id="event-edit-title" type="text" />
        <label class="checkbox-label">
          <input id="event-edit-allday" type="checkbox" />
          종일 일정
        </label>
        <label for="event-edit-date">날짜</label>
        <input id="event-edit-date" type="date" />
        <div id="event-edit-time-row" class="time-row hidden">
          <div>
            <label for="event-edit-start-time">시작 시간</label>
            <input id="event-edit-start-time" type="time" />
          </div>
          <div>
            <label for="event-edit-end-time">종료 시간</label>
            <input id="event-edit-end-time" type="time" />
          </div>
        </div>
        <div class="modal-actions">
          <button id="event-edit-cancel" type="button" class="modal-btn modal-btn-secondary">취소</button>
          <button id="event-edit-save" type="button" class="modal-btn modal-btn-primary">저장</button>
        </div>
      </div>
    </div>

    <div id="event-create-modal" class="modal-overlay hidden">
      <div class="modal-box">
        <h3>일정 추가</h3>
        <label for="event-create-calendar">캘린더</label>
        <select id="event-create-calendar"></select>
        <label for="event-create-title">제목</label>
        <input id="event-create-title" type="text" />
        <label class="checkbox-label">
          <input id="event-create-allday" type="checkbox" checked />
          종일 일정
        </label>
        <label for="event-create-date">날짜</label>
        <input id="event-create-date" type="date" />
        <div id="event-create-time-row" class="time-row hidden">
          <div>
            <label for="event-create-start-time">시작 시간</label>
            <input id="event-create-start-time" type="time" />
          </div>
          <div>
            <label for="event-create-end-time">종료 시간</label>
            <input id="event-create-end-time" type="time" />
          </div>
        </div>
        <div class="modal-actions">
          <button id="event-create-cancel" type="button" class="modal-btn modal-btn-secondary">취소</button>
          <button id="event-create-save" type="button" class="modal-btn modal-btn-primary">추가</button>
        </div>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
