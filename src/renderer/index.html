<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Hermann Planner</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header id="titlebar">
      <span id="title">Hermann Planner</span>
      <div id="window-controls">
        <button id="btn-tray" title="트레이로 최소화">—</button>
        <button id="btn-close" title="종료">×</button>
      </div>
    </header>

    <div id="auth-bar">
      <button id="btn-login">Google 계정 로그인</button>
      <button id="btn-logout" class="hidden">로그아웃</button>
      <span id="auth-status"></span>
    </div>

    <main id="content">
      <section id="pane-calendar">
        <div id="month-nav">
          <div id="month-nav-left">
            <button id="btn-prev-month" title="이전 달">◀</button>
            <span id="month-label"></span>
            <button id="btn-next-month" title="다음 달">▶</button>
          </div>
          <button id="btn-add-event" title="Google 캘린더에서 새 일정 만들기">+ 일정 추가</button>
        </div>
        <div class="weekday-row">
          <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
        </div>
        <div id="days-grid" class="days-grid"></div>
      </section>

      <section id="pane-tasks">
        <h2 class="pane-title">할일</h2>
        <div id="task-input-row">
          <input id="new-task-input" type="text" placeholder="할일 추가" />
        </div>
        <div id="tasks-list" class="scroll-list">
          <p class="empty-message">로그인 후 할일이 표시됩니다.</p>
        </div>
      </section>
    </main>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
