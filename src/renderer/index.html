<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Hermann Planner</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header id="titlebar">
      <span id="title">Hermann Planner</span>
      <div id="window-controls">
        <button id="btn-tray" title="트레이로 최소화">—</button>
        <button id="btn-close" title="종료">×</button>
      </div>
    </header>

    <div id="auth-bar">
      <button id="btn-login">Google 계정 로그인</button>
      <button id="btn-logout" class="hidden">로그아웃</button>
      <span id="auth-status"></span>
    </div>

    <nav id="tabs">
      <button class="tab-btn active" data-tab="calendar">캘린더</button>
      <button class="tab-btn" data-tab="tasks">할일</button>
    </nav>

    <main id="content">
      <section id="tab-calendar" class="tab-panel active">
        <div id="calendar-list" class="scroll-list">
          <p class="empty-message">로그인 후 일정이 표시됩니다.</p>
        </div>
      </section>

      <section id="tab-tasks" class="tab-panel">
        <div id="tasks-list" class="scroll-list">
          <p class="empty-message">로그인 후 할일이 표시됩니다.</p>
        </div>
      </section>
    </main>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
